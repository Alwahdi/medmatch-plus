name: EAS Update (Expo Go)

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/eas-update.yml"
  pull_request:
    paths:
      - "mobile/**"

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Publish update (main)
        if: github.event_name == 'push'
        working-directory: mobile
        run: eas update --branch main --message "${{ github.event.head_commit.message }}" --non-interactive

      - name: Publish update (pull request preview)
        if: github.event_name == 'pull_request'
        working-directory: mobile
        run: eas update --branch "pr-${{ github.event.pull_request.number }}" --message "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}" --non-interactive

      - name: Comment QR code on PR
        if: github.event_name == 'pull_request'
        uses: expo/expo-github-action/preview-comment@v9
        with:
          project: ./mobile
          channel: pr-${{ github.event.pull_request.number }}
