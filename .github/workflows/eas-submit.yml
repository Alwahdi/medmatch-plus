name: EAS Submit iOS

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: "Submit profile"
        required: true
        default: "production"
        type: choice
        options:
          - production

jobs:
  submit-ios:
    name: Submit iOS to App Store Connect
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Submit latest iOS build to App Store Connect
        working-directory: mobile
        env:
          # App-Specific Password from appleid.apple.com (GitHub secret)
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: eas submit --platform ios --profile ${{ github.event.inputs.build_profile }} --latest --non-interactive
